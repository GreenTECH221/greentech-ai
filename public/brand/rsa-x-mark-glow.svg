<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <!-- RSA X monogram, dark-surface variant with emissive glow.
       For use on the x-void token (#060906) and darker surfaces only. -->
  <defs>
    <linearGradient id="xg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9F08F"/>
      <stop offset="0.5" stop-color="#A8E063"/>
      <stop offset="1" stop-color="#72BF44"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(20 20)" filter="url(#glow)">
    <line x1="18" y1="102" x2="102" y2="18" stroke="url(#xg)" stroke-width="26" stroke-linecap="butt"/>
    <line x1="27.2" y1="27.2" x2="92.8" y2="92.8" stroke="url(#xg)" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
