<svg viewBox="0 0 560 160" xmlns="http://www.w3.org/2000/svg">
  <!-- RSA X horizontal lockup — dark surfaces.
       Brand rules honoured: Verdana only; 'The Profreshionals' is NEVER
       stacked with a logo, so it does not appear here. -->
  <defs>
    <linearGradient id="xg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8E063"/>
      <stop offset="1" stop-color="#72BF44"/>
    </linearGradient>
  </defs>
  <!-- leaf tile: rounded TL + BR, square TR + BL -->
  <path d="M 20 56 Q 20 20 56 20 L 116 20 L 116 104 Q 116 140 80 140 L 20 140 Z"
        fill="#72BF44"/>
  <!-- X inside the tile, leaf DNA terminals -->
  <g transform="translate(35.5 47.5) scale(0.54)">
    <line x1="14" y1="98" x2="98" y2="14" stroke="#FFFFFF" stroke-width="30" stroke-linecap="butt"/>
    <line x1="24.6" y1="24.6" x2="87.4" y2="87.4" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  </g>
  <text x="152" y="96" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-weight="bold"
        font-size="64" fill="#F2F7EE" letter-spacing="6">RSA</text>
  <text x="318" y="96" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-weight="bold"
        font-size="64" fill="url(#xg)" letter-spacing="6">X</text>
  <text x="154" y="128" font-family="Verdana, Geneva, DejaVu Sans, sans-serif"
        font-size="15" fill="#98A294" letter-spacing="7.2">GREEN TECHNOLOGY</text>
</svg>
